name: Sync kartoza/docker-geoserver

on:
  schedule: 
    interval: daily

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: git remote add upstream https://github.com/kartoza/docker-geoserver.git

      - name: Fetch upstream
        run: git fetch upstream
      
      - name: Merge upstream
        run: git merge upstream/develop --no-edit || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with: 
          title: "kartoza/docker-geoserver updates"
          branch: "sync-updates"
          commit-message: "Sync upstream updates from kartoza"
          delete-branch: true
